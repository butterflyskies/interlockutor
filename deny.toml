# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# --- Advisories -----------------------------------------------------------
[advisories]
ignore = []

# --- Licenses -------------------------------------------------------------
#
# Coverage note: this check does NOT evaluate the dev-only `trybuild` subtree.
# `cargo deny list` enumerates 13 crates; the other 16 in Cargo.lock are never
# examined, so a passing run is not evidence about their licences in either
# direction. Those were verified by hand against their packaged metadata and
# recorded in docs/dev-dependency-licenses.md, which
# scripts/check-dev-dependency-licenses.py keeps honest. Widening the traversal
# is a policy change and is tracked separately; do not cite this file's green
# result as having cleared them.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.8

# --- Bans ------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# --- Sources ---------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
